                Text(resolving?'جارٍ قراءة المحافظة والحي والشارع…':'بعد التأكيد سنحاول تعبئة المحافظة والحي والشارع تلقائياً، ويمكنك تعديلها.',textAlign:TextAlign.center,style:const TextStyle(fontSize:11)),
