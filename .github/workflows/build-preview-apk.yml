          }
          out=[]
          for num,line in enumerate(lines,1):
              out.append(fixes.get(num,line))
          main.write_text('\n'.join(out)+'\n')

          manifest = Path('buildapp/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          manifest.write_text(m)
          PY

      - name: Dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Analyze
        working-directory: buildapp
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: buildapp
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          cp buildapp/build/app/outputs/flutter-apk/app-release.apk real-estate-regular-user-preview-v5.apk
          sha256sum real-estate-regular-user-preview-v5.apk > SHA256.txt
          printf 'Standalone regular-user UI prototype v5.\nBuilt from a read-only audit of the current product UI and flows, with a new experimental visual design.\nThe source product repository was not modified.\n' > BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: regular-user-preview-v5-apk
          path: |
            real-estate-regular-user-preview-v5.apk
            SHA256.txt
            BUILD_INFO.txt
          retention-days: 7
