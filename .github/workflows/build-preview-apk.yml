            const SizedBox(height:10),Text(p.t,style:const TextStyle(fontWeight:FontWeight.w900)),
            const SizedBox(height:5),Text(p.p,style:const TextStyle(color:teal,fontWeight:FontWeight.w900)),
            const Divider(),
            valueRow('السعي',p.sai),
            valueRow('مؤشر السوق','ضمن النطاق المعتاد\n8 عقارات مقارنة'),
            valueRow('المساحة','${p.area.toInt()} م²'),
            valueRow('الغرف','${p.beds}'),valueRow('الحمامات','${p.baths}'),
            valueRow('الموقع',p.loc),valueRow('المعلن','مكتب موثق'),valueRow('التقييم','4.7 (18)'),
            const SizedBox(height:8),FilledButton.tonal(onPressed:()=>go(c,Details(p)),child:const Text('فتح العقار'))
          ])))
        )).toList())
      )
    );
  }
  Widget valueRow(String a,String b)=>Padding(
    padding:const EdgeInsets.symmetric(vertical:6),
    child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text(a,style:const TextStyle(fontSize:10,color:muted)),const SizedBox(height:2),Text(b),const Divider()])
  );
}''',
            153: r'''class _LocationPickerState extends State<LocationPicker> {
