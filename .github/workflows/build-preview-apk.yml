name: Build Preview APK

on:
  push:
    branches: [ v5-faithful-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create isolated Android shell
        run: |
          flutter create --platforms=android --project-name real_estate_ui_preview --org com.preview buildapp
          cp pubspec.yaml buildapp/pubspec.yaml
          cp lib/main_v5.dart buildapp/lib/main.dart
          rm -rf buildapp/test
          python3 - <<'PY'
          from pathlib import Path
          main = Path('buildapp/lib/main.dart')
          lines = main.read_text().splitlines()
          fixes = {
            86: r'''class _SwitchBar extends StatelessWidget {
  final String count; final bool map; final VoidCallback onSwitch,onAdd;
  const _SwitchBar({required this.count,required this.map,required this.onSwitch,required this.onAdd});
  @override Widget build(BuildContext c) {
    return Material(
      elevation:7,color:Colors.white,borderRadius:BorderRadius.circular(18),clipBehavior:Clip.antiAlias,
      child:SizedBox(height:58,child:Row(children:[
        Expanded(child:InkWell(onTap:onSwitch,child:Row(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(map?Icons.view_list_outlined:Icons.map_outlined),const SizedBox(width:7),Text(map?'قائمة':'خريطة',style:const TextStyle(fontWeight:FontWeight.w900))]))),
        const VerticalDivider(),
        Expanded(child:Center(child:Text(count,style:const TextStyle(fontWeight:FontWeight.w900)))),
        const VerticalDivider(),
        Expanded(child:InkWell(onTap:onAdd,child:const Row(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.add_circle,color:teal),SizedBox(width:7),Text('إضافة',style:TextStyle(color:teal,fontWeight:FontWeight.w900))])))
      ]))
    );
  }
}''',
            93: r'''class PropertyResult extends StatelessWidget {
  final P p; final VoidCallback onDetails,onMap;
  const PropertyResult({super.key,required this.p,required this.onDetails,required this.onMap});
