                  icon:resolving?const SizedBox.square(dimension:18,child:CircularProgressIndicator(strokeWidth:2)):const Icon(Icons.check_circle_outline),
                  label:Text(resolving?'جارٍ قراءة العنوان…':'تأكيد هذا الموقع')
