name: Build Preview APK

on:
  push:
    branches: [ v7-template-inspired-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create isolated Android shell
        run: |
          flutter create --platforms=android --project-name real_estate_ui_preview --org com.preview buildapp
          cp pubspec.yaml buildapp/pubspec.yaml
          cp lib/main_v5.dart buildapp/lib/main.dart
          rm -rf buildapp/test
          python3 tools/patch_v5.py buildapp/lib/main.dart
          python3 tools/patch_v6.py buildapp/lib/main.dart
          python3 tools/patch_v7.py buildapp/lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('buildapp/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m = m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          manifest.write_text(m)
          PY

      - name: Dependencies
        working-directory: buildapp
        run: flutter pub get

      - name: Analyze
        working-directory: buildapp
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: buildapp
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          cp buildapp/build/app/outputs/flutter-apk/app-release.apk real-estate-regular-user-preview-v7.apk
          sha256sum real-estate-regular-user-preview-v7.apk > SHA256.txt
          printf 'Standalone regular-user UI prototype v7.\nTemplate-inspired visual redesign using project-faithful content and flows.\nSource product repository was not modified.\n' > BUILD_INFO.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: regular-user-preview-v7-apk
          path: |
            real-estate-regular-user-preview-v7.apk
            SHA256.txt
            BUILD_INFO.txt
          retention-days: 7
