                child:Row(crossAxisAlignment:CrossAxisAlignment.start,children:[
                  CircleAvatar(radius:24,backgroundColor:idx==0?const Color(0xFFD5EAF1):sand,child:Text(names[idx][0],style:const TextStyle(color:navy,fontWeight:FontWeight.w900))),
                  const SizedBox(width:11),
                  Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[
                    Row(children:[Expanded(child:Text(names[idx],style:const TextStyle(fontWeight:FontWeight.w900))),Text(idx==0?'منذ 5 د':'أمس',style:const TextStyle(fontSize:9,color:muted))]),
                    const SizedBox(height:4),
                    Row(children:[const Icon(Icons.home_work_outlined,size:15,color:teal),const SizedBox(width:4),Expanded(child:Text(ps[idx].t,style:const TextStyle(fontSize:10,color:teal,fontWeight:FontWeight.w700)))]),
                    const SizedBox(height:5),
                    Text(idx==0?'تم تأكيد معاينتك غدًا الساعة 4:30 م':'هل يناسبك الموعد يوم الثلاثاء؟',maxLines:2,overflow:TextOverflow.ellipsis,style:const TextStyle(color:muted,fontSize:11))
                  ])),
                  if(idx==0) const CircleAvatar(radius:12,backgroundColor:navy,child:Text('2',style:TextStyle(color:Colors.white,fontSize:9)))
