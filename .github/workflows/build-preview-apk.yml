    return SizedBox(
      height:164,
      child:Material(
        color:Colors.white,borderRadius:BorderRadius.circular(20),clipBehavior:Clip.antiAlias,
        child:InkWell(
          onTap:onDetails,
          child:Container(
            decoration:BoxDecoration(borderRadius:BorderRadius.circular(20),border:Border.all(color:line)),
            child:Row(crossAxisAlignment:CrossAxisAlignment.stretch,children:[
              SizedBox(width:132,child:Stack(fit:StackFit.expand,children:[
                Img(p.img),
                PositionedDirectional(top:8,start:8,child:Material(color:Colors.white.withValues(alpha:.94),shape:const CircleBorder(),child:IconButton(onPressed:(){},icon:const Icon(Icons.favorite_border_rounded))))
              ])),
              Expanded(child:Padding(
                padding:const EdgeInsets.fromLTRB(12,11,12,10),
                child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[
                  Row(children:[_Badge(p.purpose),const SizedBox(width:6),_Badge(p.type),const Spacer(),IconButton(onPressed:onMap,icon:const Icon(Icons.location_on_outlined,size:19))]),
                  Text(p.t,maxLines:1,overflow:TextOverflow.ellipsis,style:const TextStyle(fontWeight:FontWeight.w900)),
                  const SizedBox(height:4),
                  Text(p.p,style:const TextStyle(color:teal,fontWeight:FontWeight.w900)),
                  const Spacer(),
                  Row(children:[const Icon(Icons.square_foot,size:15,color:muted),Text('${p.area.toInt()} م²',style:const TextStyle(fontSize:10,color:muted)),const SizedBox(width:8),const Icon(Icons.bed_outlined,size:15,color:muted),Text('${p.beds}',style:const TextStyle(fontSize:10,color:muted)),const SizedBox(width:8),const Icon(Icons.bathtub_outlined,size:15,color:muted),Text('${p.baths}',style:const TextStyle(fontSize:10,color:muted))]),
                  const SizedBox(height:5),Text(p.loc,style:const TextStyle(color:muted,fontSize:10))
                ])
              ))
            ])
          )
        )
      )
    );
  }
}''',
