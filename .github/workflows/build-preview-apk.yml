      body:SingleChildScrollView(
        scrollDirection:Axis.horizontal,padding:const EdgeInsets.all(16),
        child:Row(crossAxisAlignment:CrossAxisAlignment.start,children:items.map((p)=>Padding(
          padding:const EdgeInsetsDirectional.only(end:12),
          child:SizedBox(width:230,child:_Card(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[
